name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Verify browser workflows
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/temple-vite.log 2>&1 &
          temple_server_pid=$!
          trap 'kill "$temple_server_pid"' EXIT
          curl --retry 20 --retry-connrefused --retry-delay 1 --silent --fail --output /dev/null http://127.0.0.1:5173
          npm run test:e2e
      - name: Preserve failure screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: browser-diagnostics
          path: test-results/
          if-no-files-found: ignore
