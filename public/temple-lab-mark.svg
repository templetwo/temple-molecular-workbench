<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-labelledby="title desc">
  <title id="title">Temple Lab</title>
  <desc id="desc">A lime atom with three crossing orbits, on a rounded graphite tile.</desc>
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#28352a"/><stop offset="1" stop-color="#101913"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#d5f582" stop-opacity=".12"/><stop offset="1" stop-color="#d5f582" stop-opacity="0"/></radialGradient>
    <linearGradient id="orbit" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edffb5"/><stop offset="1" stop-color="#9dbc60"/></linearGradient>
    <linearGradient id="nucleus" x2="1" y2="1"><stop stop-color="#f3ffd6"/><stop offset=".45" stop-color="#d5f582"/><stop offset="1" stop-color="#94b451"/></linearGradient>
  </defs>
  <rect x="35" y="47" width="954" height="954" rx="216" fill="#000" opacity=".13"/>
  <rect x="35" y="29" width="954" height="954" rx="216" fill="url(#tile)"/>
  <rect x="36" y="30" width="952" height="952" rx="215" fill="none" stroke="#b3d28b" stroke-opacity=".24" stroke-width="2"/>
  <circle cx="512" cy="506" r="400" fill="url(#glow)"/>
  <g fill="none" stroke="url(#orbit)" stroke-width="17">
    <ellipse cx="512" cy="506" rx="291" ry="112" transform="rotate(30 512 506)"/>
    <ellipse cx="512" cy="506" rx="291" ry="112" transform="rotate(-30 512 506)"/>
    <ellipse cx="512" cy="506" rx="291" ry="112" transform="rotate(90 512 506)"/>
  </g>
  <circle cx="512" cy="506" r="45" fill="url(#nucleus)"/>
  <g fill="#d5f582" stroke="#1a271a" stroke-width="9"><circle cx="764" cy="651.5" r="27"/><circle cx="260" cy="651.5" r="27"/><circle cx="512" cy="215" r="27"/></g>
  <path d="M475 867h74" fill="none" stroke="#b7d590" stroke-opacity=".35" stroke-width="5" stroke-linecap="round"/>
</svg>
